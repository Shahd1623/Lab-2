<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="mainstyle.css">
</head>

<body>
    <div class="row">
        <img class="col-lg-3" src="image/location.png" alt="location">
        <div class="col-lg-8 item-center p-10">
            <h3>Address Proof</h3>
            <h1>Fill your address below</h1>
            <p>We need your parmanent address for background verification and send our product updates</p>
            <hr>

            <div class="row">
                <div class="col-12 col-lg-6 ">
                    <div class="col-12 col-lg-6 field">
                        <label>First Name</label>
                        <input placeholder="Shahd">
                    </div>
                    <hr class="col-12 col-lg-11">
                </div>
                <div class="col-12 col-lg-6 ">
                    <div class="col-12 col-lg-6 field">
                        <label>Last Name</label>
                        <input placeholder="Ghazaly">
                    </div>
                    <hr class="col-12 col-lg-12">
                </div>
            </div>
            <div class="row">
                <div class="col-12 col-lg-6 ">
                    <div class="col-12 col-lg-6 field">
                        <label>Email Address</label>
                        <input placeholder="name@gmail.com">
                    </div>
                    <hr class="col-12 col-lg-11">
                </div>
                <div class="col-12 col-lg-6 ">
                    <div class="col-12 col-lg-6 field">
                        <label>Contact</label>
                        <input placeholder="+20 12 345 6789">
                    </div>
                    <hr class="col-12 col-lg-12">
                </div>

                <div class="col-12 col-lg-6 ">
                    <div class="col-12 col-lg-6 field">
                        <label>Address</label>
                        <input placeholder="123 st">
                    </div>
                    <hr class="col-12 col-lg-11">
                </div>
                <div class="col-12 col-lg-6 ">
                    <div class="col-12 col-lg-6 field">
                        <label>Address 2</label>
                        <input placeholder="123 st">
                    </div>
                    <hr class="col-12 col-lg-12">
                </div>
                <div class="col-12 col-lg-6 ">
                    <div class="col-12 col-lg-6 field">
                        <label>States</label>
                        <input placeholder="Cario">
                    </div>
                    <hr class="col-12 col-lg-11">
                </div>
                <div class="col-12 col-lg-6 ">
                    <div class="col-12 col-lg-6 field">
                        <label>Pin code</label>
                        <input placeholder="123 456">
                    </div>
                    <hr class="col-12 col-lg-12">
                </div>
            </div>
            <div>
                <button class="col-12 btn mt-15">CONTINUE</button>
            </div>
        </div>
    </div>
</body>

</html>
